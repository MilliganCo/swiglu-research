[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiglu-fold"
version = "0.1.0"
description = "Layer-local SwiGLU permutation and Tucker experiment"
requires-python = ">=3.12"
dependencies = [
  "torch==2.7.1", "transformers>=4.51,<5", "datasets>=3,<5",
  "safetensors>=0.5", "numpy>=2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2", "PyYAML>=6,<7", "pytest>=8,<10",
]

[project.scripts]
swiglu-fold = "swiglu_fold.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
